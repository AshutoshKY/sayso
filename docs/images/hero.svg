<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-label="Sayso opened Claude — island hanging from the Mac notch">
  <defs>
    <clipPath id="iconClip">
      <rect x="548" y="78" width="36" height="36" rx="8"/>
    </clipPath>
  </defs>
  <rect width="1600" height="520" fill="#0b1220"/>

  <!-- camera housing / notch -->
  <rect x="720" y="0" width="160" height="36" rx="10" fill="#050508"/>
  <circle cx="800" cy="18" r="8" fill="#1a1a20"/>
  <circle cx="800" cy="18" r="3.2" fill="#3a3e48"/>

  <!-- IslandShape: flush to housing, square top, 22px bottom corners -->
  <path d="M520 0 H1080 V118 Q1080 148 1050 148 H550 Q520 148 520 118 Z" fill="#000000"/>

  <!-- real Claude.app icon, 24pt-equivalent, continuous corner 6 -->
  <image xlink:href="claude-64.png" x="548" y="78" width="36" height="36" clip-path="url(#iconClip)" preserveAspectRatio="xMidYMid slice"/>

  <text x="598" y="92" fill="#7dd98a" font-family="-apple-system, 'SF Pro Rounded', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.7">OPENED</text>
  <text x="598" y="118" fill="#f5f5f5" font-family="-apple-system, 'SF Pro Rounded', Helvetica, Arial, sans-serif" font-size="20" font-weight="600">Claude</text>

  <text x="80" y="250" fill="#f5f5f5" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Sayso</text>
  <text x="80" y="286" fill="#9aa3b2" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="18">Speak at the Mac notch. On-box Laya picks the app. The island shows the real app icon.</text>
  <text x="80" y="340" fill="#7dd98a" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16">● 0 cloud LLM calls</text>
  <text x="320" y="340" fill="#a85cfa" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16">● ~250 ms named decide</text>
  <text x="600" y="340" fill="#5ed2e6" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16">● 33–53 ms launch</text>
  <text x="80" y="390" fill="#6b7280" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="15">Idle is an 8 px purple dot. Expand hangs this black island from the camera housing.</text>
</svg>
