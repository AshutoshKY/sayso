<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Sayso island states: listening, opened with real app icons, fail">
  <rect width="1600" height="900" fill="#0c0c10"/>
  <rect x="0" y="0" width="1600" height="210" fill="#121214"/>

  <!-- camera housing -->
  <rect x="700" y="0" width="200" height="48" rx="10" fill="#080808"/>
  <circle cx="800" cy="24" r="12" fill="#16161a"/>
  <circle cx="800" cy="24" r="5" fill="#30343c"/>

  <!-- listening island, close-up, hanging from housing -->
  <path d="M360 0 H1240 V118 Q1240 148 1210 148 H390 Q360 148 360 118 Z" fill="#000"/>
  <g transform="translate(392 62)" fill="#a85cfa">
    <rect x="0" y="8" width="5" height="10" rx="2.5"/>
    <rect x="9" y="2" width="5" height="22" rx="2.5"/>
    <rect x="18" y="6" width="5" height="14" rx="2.5"/>
    <rect x="27" y="0" width="5" height="26" rx="2.5"/>
    <rect x="36" y="7" width="5" height="12" rx="2.5"/>
    <rect x="45" y="3" width="5" height="20" rx="2.5"/>
    <rect x="54" y="10" width="5" height="8" rx="2.5"/>
  </g>
  <text x="470" y="72" fill="#a85cfa" font-family="-apple-system, 'SF Pro Rounded', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.8">LISTENING</text>
  <text x="470" y="100" fill="#f5f5f5" font-family="-apple-system, 'SF Pro Rounded', Helvetica, Arial, sans-serif" font-size="26" font-weight="600">open anti gravity</text>
  <rect x="1108" y="64" width="92" height="32" rx="16" fill="#ffffff" fill-opacity="0.12"/>
  <text x="1154" y="86" fill="#e0e0e0" font-family="-apple-system, 'SF Pro Rounded', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Cancel</text>

  <text x="80" y="250" fill="#f5f5f5" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Island states</text>
  <text x="80" y="282" fill="#8c8c8c" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16">Pixel layout from native/notch/NotchApp.swift — IslandChrome, Waveform, IslandShape.</text>

  <!-- listening chip -->
  <g transform="translate(80 340)">
    <path d="M0 0 H460 V96 Q460 118 438 118 H22 Q0 118 0 96 Z" fill="#000"/>
    <g transform="translate(22 42)" fill="#a85cfa">
      <rect x="0" y="6" width="4" height="8" rx="2"/>
      <rect x="7" y="2" width="4" height="16" rx="2"/>
      <rect x="14" y="4" width="4" height="12" rx="2"/>
      <rect x="21" y="0" width="4" height="20" rx="2"/>
      <rect x="28" y="5" width="4" height="10" rx="2"/>
      <rect x="35" y="1" width="4" height="18" rx="2"/>
      <rect x="42" y="7" width="4" height="6" rx="2"/>
    </g>
    <text x="80" y="48" fill="#a85cfa" font-family="-apple-system, 'SF Pro Rounded', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.7">LISTENING</text>
    <text x="80" y="72" fill="#f5f5f5" font-family="-apple-system, 'SF Pro Rounded', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Speak an app name</text>
    <rect x="360" y="40" width="72" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
    <text x="396" y="58" fill="#e0e0e0" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cancel</text>
  </g>

  <!-- opened Claude — real NSWorkspace icon, same as the live island -->
  <g transform="translate(570 340)">
    <path d="M0 0 H460 V96 Q460 118 438 118 H22 Q0 118 0 96 Z" fill="#000"/>
    <image xlink:href="claude-64.png" x="20" y="38" width="32" height="32" preserveAspectRatio="xMidYMid slice"/>
    <text x="64" y="48" fill="#7dd98a" font-family="-apple-system, 'SF Pro Rounded', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.7">OPENED</text>
    <text x="64" y="72" fill="#f5f5f5" font-family="-apple-system, 'SF Pro Rounded', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Claude</text>
  </g>

  <!-- opened Notes -->
  <g transform="translate(1060 340)">
    <path d="M0 0 H460 V96 Q460 118 438 118 H22 Q0 118 0 96 Z" fill="#000"/>
    <image xlink:href="notes-64.png" x="20" y="38" width="32" height="32" preserveAspectRatio="xMidYMid slice"/>
    <text x="64" y="48" fill="#7dd98a" font-family="-apple-system, 'SF Pro Rounded', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.7">OPENED</text>
    <text x="64" y="72" fill="#f5f5f5" font-family="-apple-system, 'SF Pro Rounded', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Notes</text>
  </g>

  <!-- opened Hermes -->
  <g transform="translate(80 500)">
    <path d="M0 0 H460 V96 Q460 118 438 118 H22 Q0 118 0 96 Z" fill="#000"/>
    <image xlink:href="hermes-64.png" x="20" y="38" width="32" height="32" preserveAspectRatio="xMidYMid slice"/>
    <text x="64" y="48" fill="#7dd98a" font-family="-apple-system, 'SF Pro Rounded', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.7">OPENED</text>
    <text x="64" y="72" fill="#f5f5f5" font-family="-apple-system, 'SF Pro Rounded', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Hermes</text>
  </g>

  <!-- fail chip -->
  <g transform="translate(570 500)">
    <path d="M0 0 H460 V96 Q460 118 438 118 H22 Q0 118 0 96 Z" fill="#000"/>
    <circle cx="36" cy="52" r="12" fill="#e86b59"/>
    <path d="M31 47 L41 57 M41 47 L31 57" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="60" y="48" fill="#e86b59" font-family="-apple-system, 'SF Pro Rounded', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.7">HMM</text>
    <text x="60" y="72" fill="#f5f5f5" font-family="-apple-system, 'SF Pro Rounded', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Start Docker Desktop</text>
  </g>

  <g fill="#8c8c8c" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="15">
    <text x="80" y="700">Idle is an 8 px purple dot left of the camera. Expand hangs a black island from the housing.</text>
    <text x="80" y="728">Eyebrow is uppercase, 10 pt rounded, tracking 0.7. Headline is 13 pt. Cancel is a 0.12-white capsule.</text>
    <text x="80" y="756">Waveform is 7 capsules, 4 px wide, 3 px gap, tint rgb(0.66, 0.36, 0.98).</text>
  </g>
</svg>
