<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-label="Sayso four-step flow, left to right: you speak, island hears, Laya decides, Mac does it">
  <rect width="1600" height="640" fill="#080a10"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161c28" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c8c8c"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <text x="72" y="56" fill="#f5f5f5" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Sayso</text>
  <text x="72" y="88" fill="#8c8c8c" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16">You speak → island hears → on-box Laya decides → Mac does it. No cloud LLM.</text>

  <!-- 1 You speak -->
  <rect x="48" y="130" width="332" height="340" rx="18" fill="#101420" stroke="#a85cfa" stroke-width="1.8"/>
  <circle cx="88" cy="174" r="18" fill="#a85cfa"/>
  <text x="88" y="180" text-anchor="middle" fill="#0c0c10" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">1</text>
  <text x="76" y="236" fill="#f5f5f5" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="24" font-weight="700">You speak</text>
  <text x="76" y="280" fill="#a0a6b4" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16">Hey Mac</text>
  <text x="76" y="308" fill="#a0a6b4" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16">Control-Option-Space</text>
  <text x="76" y="336" fill="#a0a6b4" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16">hover or click</text>

  <line x1="392" y1="300" x2="448" y2="300" stroke="#8c8c8c" stroke-width="2.4" marker-end="url(#arrow)"/>

  <!-- 2 Island hears -->
  <rect x="460" y="130" width="332" height="340" rx="18" fill="#101420" stroke="#5ed2e6" stroke-width="1.8"/>
  <circle cx="500" cy="174" r="18" fill="#5ed2e6"/>
  <text x="500" y="180" text-anchor="middle" fill="#0c0c10" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">2</text>
  <text x="488" y="236" fill="#f5f5f5" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="24" font-weight="700">Island hears</text>
  <text x="488" y="280" fill="#a0a6b4" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16">Apple Speech</text>
  <text x="488" y="308" fill="#a0a6b4" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16">en-US, live partials</text>
  <text x="488" y="336" fill="#a0a6b4" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16">catalog spelling wins</text>

  <line x1="804" y1="300" x2="860" y2="300" stroke="#8c8c8c" stroke-width="2.4" marker-end="url(#arrow)"/>

  <!-- 3 Laya decides -->
  <rect x="872" y="130" width="332" height="340" rx="18" fill="#101420" stroke="#7dd98a" stroke-width="1.8"/>
  <circle cx="912" cy="174" r="18" fill="#7dd98a"/>
  <text x="912" y="180" text-anchor="middle" fill="#0c0c10" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">3</text>
  <text x="900" y="236" fill="#f5f5f5" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="24" font-weight="700">Laya decides</text>
  <text x="900" y="280" fill="#a0a6b4" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16">Docker CPU, port 8001</text>
  <text x="900" y="308" fill="#a0a6b4" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16">about 250 ms named</text>
  <text x="900" y="336" fill="#a0a6b4" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16">about 400 ms paraphrase</text>

  <line x1="1216" y1="300" x2="1272" y2="300" stroke="#8c8c8c" stroke-width="2.4" marker-end="url(#arrow)"/>

  <!-- 4 Mac does it -->
  <rect x="1284" y="130" width="268" height="340" rx="18" fill="#101420" stroke="#fac45a" stroke-width="1.8"/>
  <circle cx="1324" cy="174" r="18" fill="#fac45a"/>
  <text x="1324" y="180" text-anchor="middle" fill="#0c0c10" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">4</text>
  <text x="1312" y="236" fill="#f5f5f5" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Mac does it</text>
  <text x="1312" y="280" fill="#a0a6b4" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16">NSWorkspace</text>
  <text x="1312" y="308" fill="#a0a6b4" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16">open, close, quit</text>
  <text x="1312" y="336" fill="#a0a6b4" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16">33 to 53 ms launch</text>

  <text x="72" y="532" fill="#8c8c8c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">LayaOpener.app  →  POST :8010/decide  →  POST :8001/v1/systemone  →  NSWorkspace</text>
  <text x="72" y="564" fill="#8c8c8c" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="15">Host never talks to ChatGPT, Claude, or Gemini. Once the image is loaded, the stack is offline.</text>
</svg>
